name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LegadoIOS.xcodeproj \
            -scheme LegadoIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LegadoIOS.app Payload/
          zip -qry LegadoIOS.ipa Payload
          ls -lh LegadoIOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LegadoIOS-ipa
          path: LegadoIOS.ipa
